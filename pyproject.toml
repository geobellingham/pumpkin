[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpkin-agents"
dynamic = ["version"]
description = "Run local AI models and agents with llama.cpp: one-click models, tools, web search, schedules, voice and phone access."
readme = "README.md"
license = "LicenseRef-MIT-Commons-Clause"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
window = ["PyGObject"]

[project.scripts]
pumpkin = "pumpkin.__main__:main"

[project.urls]
Homepage = "https://github.com/geobellingham/pumpkin"

[tool.setuptools.packages.find]
include = ["pumpkin*"]          # also pumpkin.vendor.pypdf, which reads PDFs

[tool.setuptools.dynamic]
version = {attr = "pumpkin.__version__"}

[tool.setuptools.package-data]
pumpkin = ["catalog.json", "image_catalog.json", "connectors.json", "assets/*", "skills/**/*", "ui/**/*",
           "vendor/*.txt", "vendor/*.md", "mac/*", "extension/*", "extension/icons/*"]
