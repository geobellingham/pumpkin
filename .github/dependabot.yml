# Weekly pull requests when the GitHub Actions or the Android build's Gradle plugins have updates.
# The actions are pinned to exact commits; Dependabot keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    # a new major version of the Android Gradle plugin, Kotlin or Chaquopy is a migration, not an update: it is done
    # by hand when wanted
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
