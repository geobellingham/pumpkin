name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the web UI
        run: ./web/build.sh
      - name: Build llama.cpp for Android and the APK
        run: |
          set +e
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          ./android/build-android.sh > build.txt 2>&1
          code=$?
          cat build.txt
          [ "$code" -eq 0 ] || python .github/annotate.py error "Android build failed" build.txt
          exit $code
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: android/app/build/outputs/apk/
          retention-days: 7

  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: apk
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pumpkin on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python tests/e2e_android.py apk/debug/app-debug.apk > e2e.txt 2>&1; code=$?; cat e2e.txt; if [ $code -eq 0 ]; then python .github/annotate.py notice "Android emulator" e2e.txt; else python .github/annotate.py error "Android emulator failed" e2e.txt; fi; exit $code
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-screenshot
          path: android-screen.png
          retention-days: 7
