name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

# the workflow's token can only read the code
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"
      - name: Build the web UI
        run: ./web/build.sh
      - name: Reuse llama.cpp for Android when nothing changed
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: android/app/src/main/jniLibs
          key: llama-android-${{ hashFiles('web/LLAMA_TAG', 'android/build-android.sh') }}
      - name: Build llama.cpp for Android and the APK
        run: |
          set +e
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          ./android/build-android.sh > build.txt 2>&1
          code=$?
          cat build.txt
          [ "$code" -eq 0 ] || python .github/annotate.py error "Android build failed" build.txt
          exit $code
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: apk
          path: android/app/build/outputs/apk/
          retention-days: 7

  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: apk
          path: apk
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pumpkin on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python tests/e2e_android.py apk/debug/app-debug.apk > e2e.txt 2>&1; code=$?; cat e2e.txt; if [ $code -eq 0 ]; then python .github/annotate.py notice "Android emulator" e2e.txt; else python .github/annotate.py error "Android emulator failed" e2e.txt; fi; exit $code
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: android-screenshot
          path: android-screen.png
          retention-days: 7
