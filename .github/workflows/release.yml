name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Pumpkin's Mac window, built on a Mac for Apple Silicon and Intel
  mac-window:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./packaging/macos/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-window
          path: pumpkin/mac/Pumpkin

  release:
    needs: mac-window
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build the web UI
        run: ./web/build.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-window
          path: pumpkin/mac
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/pumpkin-$V"
          cp -r pumpkin packaging install.sh uninstall.sh README.md LICENSE NOTICE "dist/pumpkin-$V/"
          # the release tag is the version, so the app and the update check always agree
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" "dist/pumpkin-$V/pumpkin/__init__.py"
          grep -q "__version__ = \"$V\"" "dist/pumpkin-$V/pumpkin/__init__.py"
          find "dist/pumpkin-$V" -name __pycache__ -prune -exec rm -rf {} +
          chmod +x "dist/pumpkin-$V/pumpkin/mac/Pumpkin"
          test -s "dist/pumpkin-$V/pumpkin/mac/Pumpkin"
          tar -C dist -czf "dist/pumpkin-$V.tar.gz" "pumpkin-$V"
      - name: Windows package (Pumpkin with its own Python)
        run: ./packaging/windows/build.sh "${GITHUB_REF_NAME#v}" dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/pumpkin-*.tar.gz
            dist/pumpkin-*-windows-x64.zip
          generate_release_notes: true

  # the Android app, attached to the same release as pumpkin-<version>.apk
  android:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"
      - run: ./web/build.sh
      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" pumpkin/__init__.py
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pumpkin.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/pumpkin.jks"
          else
            echo "::warning title=Android signing::No ANDROID_KEYSTORE_B64 secret: the APK is signed with a throwaway key, so it cannot update an installed Pumpkin (uninstall first)."
          fi
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          PUMPKIN_VERSION="$V" ./android/build-android.sh
          cp android/app/build/outputs/apk/release/app-release.apk "pumpkin-$V.apk"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: pumpkin-*.apk

