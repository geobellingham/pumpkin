name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Pumpkin's Mac window, built on a Mac for Apple Silicon and Intel
  mac-window:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: ./packaging/macos/build.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mac-window
          path: pumpkin/mac/Pumpkin

  release:
    needs: mac-window
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build the web UI
        run: ./web/build.sh
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: mac-window
          path: pumpkin/mac
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/pumpkin-$V"
          cp -r pumpkin packaging install.sh uninstall.sh README.md LICENSE NOTICE "dist/pumpkin-$V/"
          # the release tag is the version, so the app and the update check always agree
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" "dist/pumpkin-$V/pumpkin/__init__.py"
          grep -q "__version__ = \"$V\"" "dist/pumpkin-$V/pumpkin/__init__.py"
          find "dist/pumpkin-$V" -name __pycache__ -prune -exec rm -rf {} +
          chmod +x "dist/pumpkin-$V/pumpkin/mac/Pumpkin"
          test -s "dist/pumpkin-$V/pumpkin/mac/Pumpkin"
          tar -C dist -czf "dist/pumpkin-$V.tar.gz" "pumpkin-$V"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/pumpkin-*.tar.gz
          generate_release_notes: true

  # the Android app, attached to the same release as pumpkin-<version>.apk
  android:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"
      - run: ./web/build.sh
      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" pumpkin/__init__.py
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pumpkin.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/pumpkin.jks"
          else
            echo "::warning title=Android signing::No ANDROID_KEYSTORE_B64 secret: the APK is signed with a throwaway key, so it cannot update an installed Pumpkin (uninstall first)."
          fi
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          PUMPKIN_VERSION="$V" ./android/build-android.sh
          cp android/app/build/outputs/apk/release/app-release.apk "pumpkin-$V.apk"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: pumpkin-*.apk

