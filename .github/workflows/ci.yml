name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        env:
          PUMPKIN_ONLINE: "1"
        run: |
          set +e
          python -m unittest discover -s tests -v > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ "$code" -ne 0 ]; then
            # also show the end of the output as an annotation, which is easy to read from the run summary
            msg=$(grep -vE "ResourceWarning|^  " test-output.txt | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Tests failed::$msg"
          fi
          exit $code

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the web UI
        run: ./web/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: pumpkin-ui
          path: pumpkin/ui
          retention-days: 7
