name: CI

on:
  push:
    branches: [main]
  pull_request:

# the workflow's token can only read the code
permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.10" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-14, python: "3.12" }        # Apple Silicon
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        env:
          PUMPKIN_ONLINE: "1"
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"                         # how Pumpkin always runs on Windows
        run: |
          set +e
          # a watchdog: if a test ever hangs, every thread's stack is printed and the job ends instead of stalling
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(540, exit=True); unittest.main(module=None, argv=['unittest', 'discover', '-s', 'tests', '-v'])" > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          [ "$code" -eq 0 ] || python .github/annotate.py error "Tests failed" test-output.txt
          exit $code

  # the unit tests on Windows, one step per file so a stall or crash points at the file
  backend-windows:
    runs-on: windows-2022
    env:
      PUMPKIN_ONLINE: "1"
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: tests/test_android.py
        id: android
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=['unittest', '-v', 'test_android'])" > out-android.txt 2>&1
          code=$?
          cat out-android.txt
          if [ "$code" -ne 0 ]; then echo "::error title=test_android failed on Windows (exit $code)::$(tr -d '\r' < out-android.txt | grep -v ResourceWarning | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code
        working-directory: tests
      - name: tests/test_backend.py
        id: backend
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=['unittest', '-v', 'test_backend'])" > out-backend.txt 2>&1
          code=$?
          cat out-backend.txt
          if [ "$code" -ne 0 ]; then echo "::error title=test_backend failed on Windows (exit $code)::$(tr -d '\r' < out-backend.txt | grep -v ResourceWarning | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code
        working-directory: tests
      - name: tests/test_devices.py
        id: devices
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=['unittest', '-v', 'test_devices'])" > out-devices.txt 2>&1
          code=$?
          cat out-devices.txt
          if [ "$code" -ne 0 ]; then echo "::error title=test_devices failed on Windows (exit $code)::$(tr -d '\r' < out-devices.txt | grep -v ResourceWarning | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code
        working-directory: tests
      - name: tests/test_features.py
        id: features
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=['unittest', '-v', 'test_features'])" > out-features.txt 2>&1
          code=$?
          cat out-features.txt
          if [ "$code" -ne 0 ]; then echo "::error title=test_features failed on Windows (exit $code)::$(tr -d '\r' < out-features.txt | grep -v ResourceWarning | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code
        working-directory: tests
      - name: tests/test_mac.py
        id: mac
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=['unittest', '-v', 'test_mac'])" > out-mac.txt 2>&1
          code=$?
          cat out-mac.txt
          if [ "$code" -ne 0 ]; then echo "::error title=test_mac failed on Windows (exit $code)::$(tr -d '\r' < out-mac.txt | grep -v ResourceWarning | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code
        working-directory: tests
      - name: tests/test_migrate.py
        id: migrate
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=['unittest', '-v', 'test_migrate'])" > out-migrate.txt 2>&1
          code=$?
          cat out-migrate.txt
          if [ "$code" -ne 0 ]; then echo "::error title=test_migrate failed on Windows (exit $code)::$(tr -d '\r' < out-migrate.txt | grep -v ResourceWarning | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code
        working-directory: tests
      - name: tests/test_recommend.py
        id: recommend
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=['unittest', '-v', 'test_recommend'])" > out-recommend.txt 2>&1
          code=$?
          cat out-recommend.txt
          if [ "$code" -ne 0 ]; then echo "::error title=test_recommend failed on Windows (exit $code)::$(tr -d '\r' < out-recommend.txt | grep -v ResourceWarning | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code
        working-directory: tests
      - name: tests/test_security.py
        id: security
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=['unittest', '-v', 'test_security'])" > out-security.txt 2>&1
          code=$?
          cat out-security.txt
          if [ "$code" -ne 0 ]; then echo "::error title=test_security failed on Windows (exit $code)::$(tr -d '\r' < out-security.txt | grep -v ResourceWarning | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code
        working-directory: tests
      - name: tests/test_workspace.py
        id: workspace
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None, argv=['unittest', '-v', 'test_workspace'])" > out-workspace.txt 2>&1
          code=$?
          cat out-workspace.txt
          if [ "$code" -ne 0 ]; then echo "::error title=test_workspace failed on Windows (exit $code)::$(tr -d '\r' < out-workspace.txt | grep -v ResourceWarning | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code
        working-directory: tests
      - name: All passed
        if: ${{ steps.android.outcome != 'success' || steps.backend.outcome != 'success' || steps.devices.outcome != 'success' || steps.features.outcome != 'success' || steps.mac.outcome != 'success' || steps.migrate.outcome != 'success' || steps.recommend.outcome != 'success' || steps.security.outcome != 'success' || steps.workspace.outcome != 'success' }}
        run: exit 1

  # the real thing: Pumpkin downloads llama.cpp and a tiny model, starts it and chats
  real:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, backend: cpu }
          - { os: macos-14, backend: "" }           # Apple Silicon: Metal
          - { os: windows-2022, backend: cpu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: End to end with a real model
        env:
          E2E_BACKEND: ${{ matrix.backend }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          set +e
          python tests/e2e_real.py > e2e.txt 2>&1
          code=$?
          cat e2e.txt
          if [ "$code" -eq 0 ]; then
            python .github/annotate.py notice "End to end on ${{ matrix.os }}" e2e.txt
          else
            python .github/annotate.py error "End to end failed on ${{ matrix.os }}" e2e.txt
          fi
          exit $code

  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, backend: cpu }
          - { os: macos-14, backend: "" }           # Apple Silicon: Metal
          - { os: windows-2022, backend: cpu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Pictures end to end with the real engine
        env:
          E2E_IMAGE_BACKEND: ${{ matrix.backend }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          set +e
          python tests/e2e_images.py > e2e.txt 2>&1
          code=$?
          cat e2e.txt
          if [ "$code" -eq 0 ]; then
            python .github/annotate.py notice "Pictures on ${{ matrix.os }}" e2e.txt
          else
            python .github/annotate.py error "Pictures failed on ${{ matrix.os }}" e2e.txt
          fi
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: picture-${{ matrix.os }}
          path: e2e-picture.jpg
          if-no-files-found: ignore
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the web UI
        run: ./web/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pumpkin-ui
          path: pumpkin/ui
          retention-days: 7

  # the installer on a real Mac and on Linux, with the UI built by the web job
  install:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pumpkin-ui
          path: pumpkin/ui
      - name: Build the Mac window
        if: runner.os == 'macOS'
        run: ./packaging/macos/build.sh
      - name: Install, start, stop, uninstall
        run: |
          set +e
          # a subshell, so set -e ends only it and the log below is still shown when something fails
          (
            set -ex
            [ "$(uname -s)" = Darwin ] || { export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"; }
            bash install.sh --no-open
            "$HOME/.local/bin/pumpkin" --version
            if [ "$(uname -s)" = Darwin ]; then
              plutil -lint "$HOME/Applications/Pumpkin.app/Contents/Info.plist"
              test -x "$HOME/Applications/Pumpkin.app/Contents/MacOS/Pumpkin"
              test -s "$HOME/Applications/Pumpkin.app/Contents/Resources/pumpkin.icns"
              file "$HOME/Applications/Pumpkin.app/Contents/MacOS/Pumpkin"
              codesign --verify --verbose "$HOME/Applications/Pumpkin.app"
              "$HOME/Applications/Pumpkin.app/Contents/MacOS/Pumpkin" --check
              # open the real app and photograph its window
              open "$HOME/Applications/Pumpkin.app"
              for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8090/ && break; sleep 2; done
              sleep 12
              screencapture -x "$GITHUB_WORKSPACE/mac-window.png" || true
              osascript -e 'tell application "System Events" to get name of every window of process "Pumpkin"' || true
              osascript -e 'tell application "Pumpkin" to quit' || true
            else
              test -f "$HOME/.local/share/applications/pumpkin.desktop"
            fi
            "$HOME/.local/bin/pumpkin" up
            "$HOME/.local/bin/pumpkin" link
            "$HOME/.local/bin/pumpkin" doctor || true
            "$HOME/.local/bin/pumpkin" stop
            bash "$HOME/.local/share/pumpkin/app/uninstall.sh"
            test ! -e "$HOME/.local/bin/pumpkin"
          ) > install.txt 2>&1
          code=$?
          cat install.txt
          if [ "$code" -eq 0 ]; then
            python .github/annotate.py notice "Installer on ${{ matrix.os }}" install.txt
          else
            python .github/annotate.py error "Installer failed on ${{ matrix.os }}" install.txt
          fi
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS' && always()
        with:
          name: mac-window-screenshot
          path: mac-window.png
          retention-days: 7

  # the Windows package: Pumpkin with its own Python, built on Linux like the release does it
  windows-package:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pumpkin-ui
          path: pumpkin/ui
      - name: Build the Windows package
        run: |
          set +e
          ./packaging/windows/build.sh 0.0.0 dist > pkg.txt 2>&1
          code=$?
          cat pkg.txt
          [ "$code" -eq 0 ] || python .github/annotate.py error "Windows package failed" pkg.txt
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pumpkin-windows
          path: dist/pumpkin-0.0.0-windows-x64.zip
          retention-days: 7

  # install it on real Windows the way people will, run the real end-to-end test with the Python inside it,
  # open the window, then uninstall
  windows:
    needs: windows-package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pumpkin-windows
          path: pkg
      - name: Install, start, open the window, stop
        shell: powershell
        run: |
          $log = "$env:GITHUB_WORKSPACE\win.txt"
          $ok = $true
          try { & {
            $ErrorActionPreference = 'Stop'
            $env:PUMPKIN_ZIP = (Resolve-Path pkg\pumpkin-0.0.0-windows-x64.zip).Path
            $env:PUMPKIN_NO_OPEN = '1'
            . .\install.ps1
            $dir = "$env:LOCALAPPDATA\Programs\Pumpkin"
            if (-not (Test-Path "$dir\python\pythonw.exe")) { throw 'no pythonw.exe' }
            foreach ($l in "$([Environment]::GetFolderPath('Programs'))\Pumpkin.lnk", "$([Environment]::GetFolderPath('Desktop'))\Pumpkin.lnk") {
              if (-not (Test-Path $l)) { throw "missing $l" }
            }
            if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Pumpkin')) { throw 'not in installed apps' }
            & "$dir\bin\pumpkin.cmd" --version
            if ($LASTEXITCODE) { throw 'pumpkin --version failed' }
            Get-Content "$dir\python\PUMPKIN_PYTHON_VERSION"
            & "$dir\bin\pumpkin.cmd" up
            if ($LASTEXITCODE) { Get-Content "$env:LOCALAPPDATA\pumpkin\state\pumpkin.log" -ErrorAction SilentlyContinue; throw 'pumpkin up failed' }
            $tok = (Get-Content -Raw "$env:APPDATA\pumpkin\token").Trim()
            $st = Invoke-RestMethod -Headers @{ Authorization = "Bearer $tok" } http://127.0.0.1:8090/pumpkin/api/state
            "platform: $($st.platform), version $($st.version)"
            $hw = Invoke-RestMethod -Headers @{ Authorization = "Bearer $tok" } http://127.0.0.1:8090/pumpkin/api/hardware
            $hw | ConvertTo-Json -Depth 4
            & "$dir\bin\pumpkin.cmd" doctor
            # no console window may show up: only the hidden ones
            Get-Process python*, llama* -ErrorAction SilentlyContinue | Select-Object Name, MainWindowTitle, Path | Format-Table -AutoSize | Out-String -Width 300
            # the window (Edge in app mode), photographed
            Start-Process -FilePath "$dir\python\pythonw.exe" -ArgumentList '-X','utf8','-m','pumpkin','open' -WorkingDirectory $dir
            Start-Sleep 15
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:GITHUB_WORKSPACE\windows-window.png")
            Get-Process msedge -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | Select-Object MainWindowTitle | Format-Table | Out-String
            & "$dir\bin\pumpkin.cmd" stop
            Start-Sleep 3
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          } *>&1 | Out-File -Encoding utf8 $log } catch { $ok = $false; "FAILED: $_" | Out-File -Append -Encoding utf8 $log }
          Get-Content $log
          if ($ok) { python .github/annotate.py notice "Windows install" $log } else { python .github/annotate.py error "Windows install failed" $log; exit 1 }
      - name: End to end with a real model, using the Python inside the package
        shell: bash
        env:
          E2E_BACKEND: cpu
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          set +e
          E2E_PYTHON="$LOCALAPPDATA/Programs/Pumpkin/python/python.exe" python tests/e2e_real.py > e2e.txt 2>&1
          code=$?
          cat e2e.txt
          if [ "$code" -eq 0 ]; then
            python .github/annotate.py notice "End to end on Windows (packaged Python)" e2e.txt
          else
            python .github/annotate.py error "End to end failed on Windows (packaged Python)" e2e.txt
          fi
          exit $code
      - name: Uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $bad = $null
          try { & "$env:LOCALAPPDATA\Programs\Pumpkin\uninstall.ps1" *>&1 | Out-File -Encoding utf8 un.txt } catch { "FAILED: $_" | Out-File -Append -Encoding utf8 un.txt; $bad = 'Uninstall threw' }
          Get-Content un.txt
          if (Test-Path "$env:LOCALAPPDATA\Programs\Pumpkin") { $bad = 'Uninstall left files' }
          if (Test-Path "$([Environment]::GetFolderPath('Programs'))\Pumpkin.lnk") { $bad = 'Uninstall left the shortcut' }
          if ($bad) { python .github/annotate.py error $bad un.txt; exit 1 }
          exit 0
      - name: Install the published release (the download path people use)
        shell: powershell
        env:
          PUMPKIN_NO_OPEN: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          . .\install.ps1
          $dir = "$env:LOCALAPPDATA\Programs\Pumpkin"
          & "$dir\python\python.exe" -X utf8 -c "import pumpkin; print('installed', pumpkin.__version__)"
          if ($LASTEXITCODE) { throw 'the downloaded package does not start' }
          & "$dir\uninstall.ps1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-window-screenshot
          path: windows-window.png
          retention-days: 7
