name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.10" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-14, python: "3.12" }        # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        env:
          PUMPKIN_ONLINE: "1"
        run: |
          set +e
          python -m unittest discover -s tests -v > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          [ "$code" -eq 0 ] || python .github/annotate.py error "Tests failed" test-output.txt
          exit $code

  # the real thing: Pumpkin downloads llama.cpp and a tiny model, starts it and chats
  real:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, backend: cpu }
          - { os: macos-14, backend: "" }           # Apple Silicon: Metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: End to end with a real model
        env:
          E2E_BACKEND: ${{ matrix.backend }}
        run: |
          set +e
          python tests/e2e_real.py > e2e.txt 2>&1
          code=$?
          cat e2e.txt
          if [ "$code" -eq 0 ]; then
            python .github/annotate.py notice "End to end on ${{ matrix.os }}" e2e.txt
          else
            python .github/annotate.py error "End to end failed on ${{ matrix.os }}" e2e.txt
          fi
          exit $code

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the web UI
        run: ./web/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: pumpkin-ui
          path: pumpkin/ui
          retention-days: 7

  # the installer on a real Mac and on Linux, with the UI built by the web job
  install:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: pumpkin-ui
          path: pumpkin/ui
      - name: Install, start, stop, uninstall
        run: |
          set +e
          {
            set -ex
            export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
            bash install.sh --no-open
            "$HOME/.local/bin/pumpkin" --version
            if [ "$(uname -s)" = Darwin ]; then
              plutil -lint "$HOME/Applications/Pumpkin.app/Contents/Info.plist"
              test -x "$HOME/Applications/Pumpkin.app/Contents/MacOS/Pumpkin"
              test -s "$HOME/Applications/Pumpkin.app/Contents/Resources/pumpkin.icns"
            else
              test -f "$HOME/.local/share/applications/pumpkin.desktop"
            fi
            "$HOME/.local/bin/pumpkin" up
            "$HOME/.local/bin/pumpkin" link
            "$HOME/.local/bin/pumpkin" doctor || true
            "$HOME/.local/bin/pumpkin" stop
            bash "$HOME/.local/share/pumpkin/app/uninstall.sh"
            test ! -e "$HOME/.local/bin/pumpkin"
          } > install.txt 2>&1
          code=$?
          cat install.txt
          if [ "$code" -eq 0 ]; then
            python .github/annotate.py notice "Installer on ${{ matrix.os }}" install.txt
          else
            python .github/annotate.py error "Installer failed on ${{ matrix.os }}" install.txt
          fi
          exit $code

